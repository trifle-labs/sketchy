<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>marbleyes</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #eee; font-family: system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; }

    #hud {
      position: fixed; top: 12px; left: 12px;
      font-size: 12px; opacity: 0.7; pointer-events: none;
      letter-spacing: 0.05em;
    }

    #modal {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    #modal[hidden] { display: none; }
    .modal-inner {
      position: relative;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px 28px;
      max-width: min(560px, 90vw);
      max-height: 80vh;
      overflow: auto;
    }
    #modal-close {
      position: absolute; top: 8px; right: 12px;
      background: transparent; border: 0; color: #888;
      font-size: 22px; cursor: pointer;
    }
    #modal-close:hover { color: #fff; }
    .modal-inner h2 { margin-top: 0; }

    #map {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 220px;
      height: 220px;
      background: rgba(10, 10, 20, 0.65);
      border: 1px solid #333;
      border-radius: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <canvas id="map" width="220" height="220"></canvas>
  <div id="hud">WASD / arrows to steer · space to jump (also closes modal)</div>

  <div id="modal" hidden>
    <div class="modal-inner">
      <button id="modal-close" aria-label="close">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
